<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    TrayIcon.svg — 32x32 system tray version.
    White/light symbol on transparent background so it reads clearly on
    both light and dark Windows taskbars.
    Simplified: speech bubble + waveform only (no shadow, no gradients).
  -->

  <!-- ── Speech bubble outline ── -->
  <rect x="2" y="2" width="22" height="16" rx="4" ry="4"
        fill="#FFFFFF" fill-opacity="0.0"
        stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- Bubble tail -->
  <path d="M 7,18 L 5,24 L 13,18 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>

  <!-- ── Waveform bars inside bubble ── -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="2">
    <line x1="7"  y1="11" x2="7"  y2="8"/>
    <line x1="11" y1="13" x2="11" y2="6"/>
    <line x1="15" y1="13" x2="15" y2="6"/>
    <line x1="19" y1="11" x2="19" y2="8"/>
  </g>

  <!-- ── Microphone (bottom-right) ── -->
  <!-- Capsule -->
  <rect x="19" y="17" width="10" height="13" rx="5" ry="5" fill="#FFFFFF"/>
  <!-- Stand arc -->
  <path d="M 16,26 Q 16,31 24,31 Q 32,31 32,26"
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Post -->
  <line x1="24" y1="31" x2="24" y2="32"
        stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ── Small sparkle (top-right, AI hint) ── -->
  <path d="M 29,3 L 30,5.5 L 32,6.5 L 30,7.5 L 29,10 L 28,7.5 L 26,6.5 L 28,5.5 Z"
        fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
